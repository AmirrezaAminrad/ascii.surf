  <g font-size="12" font-weight="bold" fill="#e7f6ec">
    <text x="76"   y="1198">buildScene()</text>
    <text x="324"  y="1198">RenderSession</text>
    <text x="572"  y="1198">drift-corrected timer</text>
    <text x="820"  y="1198">renderFrame()</text>
    <text x="1068" y="1198">frameToAnsi()</text>
    <text x="1316" y="1198">stdout</text>
  </g>
  <g font-size="10.5" fill="#93bda3">
    <text x="76"   y="1216">flags · --state · defaults</text>
    <text x="324"  y="1216">angles · inertia · idle skip</text>
    <text x="572"  y="1216">default 30 fps (1–120)</text>
    <text x="820"  y="1216">the identical engine</text>
    <text x="1068" y="1216">run-length SGR truecolor</text>
    <text x="1316" y="1216">alt screen · raw mode · mouse</text>
