  <g font-size="10.5" fill="#93bda3">
    <text x="76"   y="1089">the canvas you watch</text>
    <text x="432"  y="1089">TXT · ANSI · HTML · SVG (exports.ts) · PNG</text>
    <text x="812"  y="1089">GIF (15 fps · gifenc) · WebM (captureStream)</text>
    <text x="1172" y="1089">raw frame · ANSI text</text>
  </g>

  <!-- ===================== lane 6: cli ===================== -->
  <rect x="40" y="1140" width="1520" height="112" rx="10" fill="#0d1310" stroke="#ff9e64" stroke-opacity="0.45" stroke-width="1.2"/>
  <text x="56" y="1164" font-size="12" font-weight="bold" letter-spacing="1.5" fill="#ff9e64">CLI — cli/src — the identical engine in a terminal</text>
  <g stroke="#ff9e64" stroke-opacity="0.8" stroke-width="1.3" fill="#101815">
    <rect x="64"   y="1176" width="232" height="56" rx="6"/>
    <rect x="312"  y="1176" width="232" height="56" rx="6"/>
    <rect x="560"  y="1176" width="232" height="56" rx="6"/>
