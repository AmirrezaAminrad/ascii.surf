  <text x="668" y="706" font-size="10" fill="#6f9781">skips projection</text>

  <!-- engine -> present -->
  <path d="M 1310 640 L 1310 884" stroke="#4e7d62" stroke-width="1.5" fill="none" marker-end="url(#arr)"/>
  <text x="1322" y="752" font-size="10.5" fill="#93bda3">RenderResult — chars + lum</text>

  <!-- ===================== lane 4: present ===================== -->
  <rect x="40" y="890" width="1520" height="100" rx="10" fill="#0d1310" stroke="#6fc3ff" stroke-opacity="0.45" stroke-width="1.2"/>
  <text x="56" y="914" font-size="12" font-weight="bold" letter-spacing="1.5" fill="#6fc3ff">PRESENT — canvas 2D (src/components/AsciiView.tsx)</text>
  <rect x="64" y="926" width="696" height="50" rx="6" fill="#101815" stroke="#6fc3ff" stroke-opacity="0.8" stroke-width="1.3"/>
  <text x="76" y="946" font-size="12.5" font-weight="bold" fill="#e7f6ec">mono + ramp — one fillText() per row</text>
  <text x="76" y="964" font-size="10.5" fill="#93bda3">a monospace font advances spaces identically; blank rows skipped</text>
  <rect x="800" y="926" width="440" height="50" rx="6" fill="#101815" stroke="#6fc3ff" stroke-opacity="0.8" stroke-width="1.3"/>
  <text x="812" y="946" font-size="12.5" font-weight="bold" fill="#e7f6ec">colored — run-length glyph runs</text>
  <text x="812" y="964" font-size="10.5" fill="#93bda3">32-step palette · glow shadow · plasma rebuilt per frame</text>
  <rect x="1280" y="926" width="260" height="50" rx="6" fill="#101815" stroke="#6fc3ff" stroke-opacity="0.8" stroke-width="1.3"/>
  <text x="1292" y="946" font-size="12.5" font-weight="bold" fill="#e7f6ec">stats → external store</text>
  <text x="1292" y="964" font-size="10.5" fill="#93bda3">EMA timings every 250 ms</text>

  <!-- present -> outputs -->
  <path d="M 800 990 L 800 1014" stroke="#4e7d62" stroke-width="1.5" fill="none" marker-end="url(#arr)"/>
  <text x="812" y="1008" font-size="10.5" fill="#93bda3">frameRef · lumRef · canvasRef</text>

  <!-- ===================== lane 5: outputs ===================== -->
  <rect x="40" y="1020" width="1520" height="90" rx="10" fill="#0d1310" stroke="#c792ea" stroke-opacity="0.45" stroke-width="1.2"/>
  <text x="56" y="1044" font-size="12" font-weight="bold" letter-spacing="1.5" fill="#c792ea">OUTPUTS</text>
  <g stroke="#c792ea" stroke-opacity="0.8" stroke-width="1.3" fill="#101815">
    <rect x="64"   y="1056" width="316" height="40" rx="6"/>
    <rect x="420"  y="1056" width="340" height="40" rx="6"/>
    <rect x="800"  y="1056" width="320" height="40" rx="6"/>
    <rect x="1160" y="1056" width="380" height="40" rx="6"/>
  </g>
  <g font-size="12.5" font-weight="bold" fill="#e7f6ec">
    <text x="76"   y="1073">screen</text>
